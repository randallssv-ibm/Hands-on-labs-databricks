resources:
  pipelines:
    ghcn_bronze:
      name: ghcn_bronze
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      serverless: true
      continuous: false
      configuration:
        ghcn.source_year: ${var.source_year}
      libraries:
        - file:
            path: ../../../data-pipeline/NOAA/pipelines/NOAA_bronze_pipeline.py
      # permissions:
      #   - level: CAN_MANAGE
      #     group_name: dbx_labs_data_engineers
      #   - level: CAN_VIEW
      #     group_name: dbx_labs_analytics
      # notifications:
      #   - email_recipients:
      #       - ${var.notification_email}
      #     alerts:
      #       - on-update-failure
      #       - on-update-fatal-failure
      #       - on-flow-failure        

  jobs:
    bronze_ingest:
      name: ghcn_bronze_ingest

      tasks:
        - task_key: build_bronze_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.ghcn_bronze.id}

        - task_key: daily_csv_streaming
          depends_on:
            - task_key: build_bronze_pipeline
          notebook_task:
            notebook_path: ../../../data-pipeline/NOAA/jobs/NOAA_station_streaming.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.bronze_schema}
